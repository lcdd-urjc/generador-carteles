        <tspan x="0" y="216" text-anchor="end" class="t4">¡Y MUCHOS MÁS!</tspan>
    </text>
    <text class="texto" style="transform: matrix(.915,0,0,.915,1468.479,1588.263);">
        <tspan x="0" y="0" text-anchor="end" class="t4">Virus, Catán, Munchkin,</tspan>
        <tspan x="0" y="72" text-anchor="end" class="t4">Coup, Qé, Carcassone,</tspan>
        <tspan x="0" y="144" text-anchor="end" class="t4">Exploding Kittens,</tspan>
        <tspan x="0" y="216" text-anchor="end" class="t4">¡Y MUCHOS MÁS!</tspan>
    </text>
